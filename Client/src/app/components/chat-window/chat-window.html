<!-- <img src="chatopen.svg" alt="ChatOpen Image" style="background-image: url(''); background-repeat: no-repeat; background-size: contain;background-color: white;background-position: bottom;"> -->
@if (chatService.currentOpenedChat()) {
    <div class="relative w-full h-full flex flex-col bg-[#dfe7f1]">
        <div class="chat-header flex justify-between items-center w-full p-4 bg-white shadow-sm">
            <div>
                <span class="font-bold leading-normal ">
                    {{chatService.currentOpenedChat()?.fullName | titlecase}}
                </span>
                <br>
                <span class="text-gray-400 text-sm font-bold">
                    {{chatService.status(chatService.currentOpenedChat()?.userName!)}}
                </span>
            </div>
            <div>
                <mat-icon class="video-icon">video_call</mat-icon>
                <style>
                    .video-icon {
                        cursor: pointer;
                        transition: color 0.3s ease;
                    }
                    .video-icon:hover {
                        color: #ef4444; /* Tailwind's red-500 hex value */
                    }
                </style>
            </div>
        </div>

        <div class="flex-1 min-h-0 overflow-hidden">
            <app-chat-box class="h-full"></app-chat-box>
        </div>

        <div class="sticky bottom-0 bg-white p-3">
            <div class="flex items-center gap-3">
                <input type="text" 
                    (input)="chatService.NotifyTyping()"
                    (keydown.enter)="SendMessage()"
                    [(ngModel)]="message" 
                    class="flex-1 bg-gray-200 focus:outline-none text-gray-900 rounded-full px-6 py-2" 
                    placeholder="type Message..."/>
                <mat-icon (click)="SendMessage()" class="video-icon ml-5 cursor-pointer">
                    send
                </mat-icon>
            </div>
        </div>
    </div>
}@else {
    <div class="flex flex-col items-center justify-center h-full p-4">
        <img src="chatopen.svg" alt="ChatOpen Image" />
    </div>
}
